[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-functional-self-lab"
version = "1.1.0"
description = "A controlled, testable lab for functional self-models and open-ended research loops. Not a claim of consciousness."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Open Functional Self Lab contributors" }]
keywords = ["research-infrastructure", "audit-ledger", "budget-guard", "sandbox"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
# 可选：想接真实环境/向量记忆时再装，v0.1 核心不依赖它们。
env = ["gymnasium>=1.0"]
memory = ["chromadb>=0.4"]

[project.scripts]
ofsl = "lab.cli:main"

[tool.setuptools]
packages = ["lab"]
